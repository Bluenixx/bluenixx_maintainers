name: Update site data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [bluenixx.maintainers]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: python3 scripts/build_data.py
      - name: Commit if changed
        run: |
          git config user.name "bluenixx-bot"
          git config user.email "bluenixx-bot@users.noreply.github.com"
          git add site/data/devices.json
          git diff --cached --quiet || (git commit -m "site: update device data" && git push)
