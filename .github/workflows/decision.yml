name: Decision

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  decide:
    if: github.event.label.name == 'approved' || github.event.label.name == 'rejected'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const approved = context.payload.label.name === 'approved';
            const body = approved
              ? `@${issue.user.login} your application was approved. Someone from the team will get in touch about the next steps.`
              : `@${issue.user.login} thanks for applying. We are not going forward with this one right now. A reviewer will leave a note here with the reason.`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: approved ? 'completed' : 'not_planned',
            });
